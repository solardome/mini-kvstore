name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancel in-flight runs on same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release

jobs:
  # ═══════════════════════════════════════
  # Job 1: Build & Unit Test
  # ═══════════════════════════════════════
  build-and-test:
    name: "Build & Test (${{ matrix.compiler }})"
    # Fix 2: pinned OS version instead of ubuntu-latest
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      # Fix 2: SHA-pinned first-party action (v4.2.2)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential ccache
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y clang
          fi

      - name: Cache ccache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.compiler }}-${{ hashFiles('src/**', 'tests/**') }}
          restore-keys: ccache-${{ matrix.compiler }}-

      - name: Configure
        run: |
          CC=${{ matrix.compiler }} cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_C_COMPILER=${{ matrix.compiler }}

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Run tests
        run: ctest --test-dir build --output-on-failure --timeout 30

      - name: Upload build artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: kvstore-${{ matrix.compiler }}
          path: build/kvstore
          retention-days: 5

  # ═══════════════════════════════════════
  # Job 2: Sanitizer tests (memory safety)
  # ═══════════════════════════════════════
  sanitizers:
    name: "Sanitizers (${{ matrix.sanitizer.name }})"
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        sanitizer:
          - { name: asan, flag: ENABLE_ASAN }
          - { name: ubsan, flag: ENABLE_UBSAN }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential ccache

      - name: Cache ccache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ~/.cache/ccache
          key: ccache-sanitizer-${{ matrix.sanitizer.name }}-${{ hashFiles('src/**', 'tests/**') }}
          restore-keys: ccache-sanitizer-${{ matrix.sanitizer.name }}-

      - name: Build with ${{ matrix.sanitizer.name }}
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -D${{ matrix.sanitizer.flag }}=ON
          cmake --build build --parallel $(nproc)

      - name: Run tests under ${{ matrix.sanitizer.name }}
        run: ctest --test-dir build --output-on-failure --timeout 60

  # ═══════════════════════════════════════
  # Job 3: Code Coverage
  # Fix 3: new coverage job with lcov report
  # ═══════════════════════════════════════
  coverage:
    name: "Coverage"
    runs-on: ubuntu-24.04
    needs: [build-and-test]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential ccache lcov

      - name: Cache ccache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ~/.cache/ccache
          key: ccache-coverage-${{ hashFiles('src/**', 'tests/**') }}
          restore-keys: ccache-coverage-

      - name: Build with coverage instrumentation
        run: |
          cmake -B build-cov \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_COVERAGE=ON
          cmake --build build-cov --parallel $(nproc)

      - name: Run tests
        run: ctest --test-dir build-cov --output-on-failure --timeout 30

      - name: Generate coverage report
        run: |
          lcov --capture \
               --directory build-cov \
               --output-file coverage.info \
               --ignore-errors mismatch
          lcov --remove coverage.info '/usr/*' \
               --output-file coverage.info \
               --ignore-errors unused
          lcov --list coverage.info
          COVERAGE=$(lcov --summary coverage.info 2>&1 \
            | grep "lines" | grep -o '[0-9]*\.[0-9]*%' | head -1 || echo "unknown")
          echo "### Coverage: ${COVERAGE}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage data
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: coverage-report
          path: coverage.info
          retention-days: 14

  # ═══════════════════════════════════════
  # Job 4: Static Analysis & Linting
  # Fix 4: clang-tidy and banned-functions are now blocking (no || true)
  # ═══════════════════════════════════════
  lint:
    name: "Lint & Static Analysis"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential clang-tidy cppcheck

      - name: Generate compile_commands.json
        run: cmake -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # Fix 4: removed || true — clang-tidy warnings now fail the build
      - name: Run clang-tidy
        run: |
          clang-tidy \
            -p build \
            --warnings-as-errors='*' \
            src/*.c

      - name: Run cppcheck
        run: |
          cppcheck \
            --enable=warning,style,performance \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --suppress=constParameterPointer \
            --inline-suppr \
            -I src/ \
            src/

      # Fix 4: script now exits 1 on findings (hard gate)
      - name: Check banned functions
        run: bash scripts/check-banned-functions.sh src/

  # ═══════════════════════════════════════
  # Job 5: Fuzzing
  # Fix 10: 30-second libFuzzer smoke test on every PR
  # ═══════════════════════════════════════
  fuzz:
    name: "Fuzzing (30s)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y cmake clang ccache

      - name: Cache ccache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ~/.cache/ccache
          key: ccache-fuzz-${{ hashFiles('src/**', 'tests/**') }}
          restore-keys: ccache-fuzz-

      - name: Build fuzz target
        run: |
          cmake -B build-fuzz \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DENABLE_FUZZING=ON
          cmake --build build-fuzz --parallel $(nproc)

      - name: Run fuzzer (30s smoke test)
        run: |
          build-fuzz/fuzz_kvstore \
            -max_total_time=30 \
            -max_len=256 \
            -print_final_stats=1

  # ═══════════════════════════════════════
  # Job 6: Security Scanning
  # ═══════════════════════════════════════
  security:
    name: "Security Scan"
    runs-on: ubuntu-24.04
    needs: [build-and-test]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Flawfinder
        run: pip install flawfinder

      - name: Run Flawfinder (SAST for C/C++)
        run: |
          flawfinder --minlevel=2 --sarif src/ > flawfinder-results.sarif || true
          flawfinder --minlevel=1 --columns --context src/
          echo ""
          echo "=== Summary ==="
          flawfinder --minlevel=2 --quiet src/
          HITS=$(flawfinder --minlevel=3 --quiet src/ | grep -c "^" || true)
          echo "High severity findings: $HITS"
          if [ "$HITS" -gt 0 ]; then
            echo "::warning::Found $HITS high-severity findings"
          fi

      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: flawfinder-results.sarif
        continue-on-error: true # OK if not on a public repo

  # ═══════════════════════════════════════
  # Job 7: Docker Build + SBOM
  # Fix 5: ubuntu:24.04 in Dockerfile
  # Fix 6: Trivy CRITICAL findings now block the build (exit-code: 1)
  # Fix 7: SBOM generated with anchore/sbom-action
  # ═══════════════════════════════════════
  docker:
    name: "Docker Build"
    runs-on: ubuntu-24.04
    needs: [build-and-test]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: mini-kvstore:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fix 6: exit-code 1 means CRITICAL CVEs fail the job
      - name: Run Trivy container scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: mini-kvstore:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

      # Fix 7: generate SBOM in SPDX format
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: mini-kvstore:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90
  # ═══════════════════════════════════════
  # Job 8: Release Gate
  # Fix 8: creates a real GitHub Release with binary + SBOM attached
  # Fix 8: passes binary path to release-gate.sh (not hardcoded)
  # ═══════════════════════════════════════
  gate:
    name: Security Gate
    needs: [build-and-test, sanitizers, coverage, lint, fuzz, security, docker]
    runs-on: ubuntu-latest
    steps:
      # - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      #   with:
      #     name: security-gate_linux_amd64

      # - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      #   with:
      #     name: scan-trivy
      - name: Run security-gate
        env:
          SECURITY_GATE_REPO_CRITICALITY: high
          SECURITY_GATE_EXPOSURE: internet
          SECURITY_GATE_CHANGE_TYPE: application
          SECURITY_GATE_SCANNER_NAME: trivy+gosec
          SECURITY_GATE_SCANNER_VERSION: trivy-v0.35.0+gosec-v2.25.0
          SECURITY_GATE_ARTIFACT_SIGNED: "no"
          SECURITY_GATE_PROVENANCE_LEVEL: unknown
          SECURITY_GATE_BUILD_CONTEXT_INTEGRITY: verified
        run: |
          # Download security-gate binary
          curl -sSL https://github.com/solardome/security-gate/releases/download/v0.3.0/security-gate_linux_amd64 \
          -o security-gate && chmod +x security-gate

          set +e
          chmod +x ./security-gate
          ./security-gate \
            --scan trivy.json \
            --context-auto \
            --out-json  gate-report.json \
            --out-html  gate-report.html \
            --checksums gate-checksums.sha256 \
            --run-log   gate.run.log
          EXIT_CODE=$?
          set -e

          case "${EXIT_CODE}" in
            0) echo "Security gate: ALLOW" ;;
            1) echo "::warning::Security gate: WARN — review report artifact" ;;
            2) echo "::error::Security gate: BLOCK — release will not proceed"; exit 2 ;;
          esac

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: security-gate-report
          path: |
            gate-report.json
            gate-report.html
            gate-checksums.sha256
            gate.run.log
          retention-days: 30
  release-gate:
    name: "Release Gate"
    runs-on: ubuntu-24.04
    needs: [gate]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write # required to create GitHub Releases and tags
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Download GCC binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: kvstore-gcc
          path: artifacts/

      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sbom
          path: artifacts/

      - name: Release decision
        id: gate
        run: |
          chmod +x scripts/release-gate.sh
          ./scripts/release-gate.sh artifacts/kvstore

      # Fix 8: real GitHub Release (not just a local tag echo)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.gate.outputs.version }}"
          name: "Release v${{ steps.gate.outputs.version }}"
          generate_release_notes: true
          files: |
            artifacts/kvstore
            artifacts/sbom.spdx.json
